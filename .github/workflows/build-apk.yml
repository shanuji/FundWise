name: Build and Release Flutter APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Scaffolding
        run: flutter create --platforms android .

      - name: Force Compile SDK to 36
        run: |
          find android -type f -name "build.gradle*" -exec sed -i 's/flutter.compileSdkVersion/36/g' {} +
          find android -type f -name "build.gradle*" -exec sed -i 's/flutter.targetSdkVersion/36/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MutualFundApp-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
