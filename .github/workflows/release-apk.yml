name: Build and publish latest APK
on:
  push:
    branches: [equitybasket-rebuild, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create --platforms android --org com.shanuji .
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Publish APK to latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest EquityBasket APK
          body: |
            Latest EquityBasket Android APK.
            Download app-release.apk from Assets.
            Personal release build, not signed for Play Store publishing.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          overwrite_files: true
